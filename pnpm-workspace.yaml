packages:
  - packages/*
  - examples/*
  - templates/*
  - test/conformance
  # Vendored Mastra packages keep Mastra's layout: upstream/<pkg>@<version>/{stores,packages,workflows}/<name>
  - test/conformance/upstream/*/stores/*
  - test/conformance/upstream/*/packages/*
  - test/conformance/upstream/*/packages/_vendored/*
  - test/conformance/upstream/*/workflows/*
  - test/resonate
  - scripts

# Supply chain (design §66 §11.2; the 2026-06 @mastra/* npm compromise):
# exact versions, and no third-party release younger than three days.
saveExact: true
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@loams/*'

# Dependency lifecycle scripts are blocked unless allowed here (pnpm 11, MA-R0.6).
allowBuilds:
  # tsx's esbuild: its postinstall only verifies the platform binary, which the optional
  # dependency already provides.
  esbuild: false
