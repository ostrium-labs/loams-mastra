name: CI

# GitHub-hosted runners only (ubuntu-24.04). Every action is pinned by commit SHA.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Lint, typecheck, test, licences
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm licences
      - name: npm audit signatures
        run: npm audit signatures
      - name: Repository checks
        run: node scripts/repo-checks.mjs

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint 1.7.12 (checksum-verified)
        run: |
          curl -fsSL -o actionlint.tgz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tgz" | sha256sum -c -
          tar xzf actionlint.tgz actionlint
      - run: ./actionlint -color

  harness:
    name: Loams harness
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: start_loams_refuses_bad_checksum
        run: test/conformance/loams/test.sh
      - name: Install the pinned Loams release
        run: test/conformance/loams/install-loams.sh
      - name: Start loams dev with API keys
        run: test/conformance/loams/start-loams.sh --auth
      - name: Start Loams Postgres
        run: test/conformance/loams/start-postgres.sh
      - name: The key works and the namespace header is honoured
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "api-key: $LOAMS_API_KEY" -H 'Loams-Namespace: harness' "$LOAMS_QDRANT_URL/collections")
          test "$code" = 200
          code=$(curl -s -o /dev/null -w '%{http_code}' "$LOAMS_QDRANT_URL/collections")
          test "$code" = 401
      - name: Stop
        if: always()
        run: test/conformance/loams/stop.sh ${{ job.status != 'success' && '--logs' || '' }}

  resonate:
    # The Resonate engine against a real Resonate server: the upstream server
    # (pinned in packages/resonate/docker-compose.yaml) and Loams Durable from the
    # pinned Loams 0.1.0 image (its .deb lacks Durable: ostrium-labs/loams#925).
    name: Resonate (${{ matrix.backend }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        backend: [upstream, loams]
    env:
      RESONATE_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start the upstream Resonate server
        if: matrix.backend == 'upstream'
        run: test/resonate/start-resonate.sh
      - name: Start Loams Durable
        if: matrix.backend == 'loams'
        run: |
          test/resonate/start-loams-durable.sh
          echo "LOAMS_KILL_CMD=docker kill -s KILL mastra-resonate-loams" >> "$GITHUB_ENV"
          echo "LOAMS_START_CMD=$GITHUB_WORKSPACE/test/resonate/start-loams-durable.sh" >> "$GITHUB_ENV"
      - run: pnpm --filter @loams/mastra-resonate build
      - name: Engine tests
        run: pnpm --filter @loams/mastra-resonate test
      - name: Crash and backend tests
        run: pnpm --filter @loams-internal/resonate-tests test
      - name: Server logs
        if: failure()
        run: |
          docker compose -f packages/resonate/docker-compose.yaml logs || true
          docker logs mastra-resonate-loams || true

  required:
    name: CI required
    if: always()
    needs:
      - checks
      - actionlint
      - harness
      - resonate
    runs-on: ubuntu-24.04
    steps:
      - name: Require all CI jobs to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          if jq -e '[.[] | .result] | any(. != "success" and . != "skipped")' <<< "$NEEDS_JSON"; then
            echo "A CI job failed or was cancelled" >&2
            exit 1
          fi
