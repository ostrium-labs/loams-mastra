name: CI

# GitHub-hosted runners only (ubuntu-24.04). Every action is pinned by commit SHA.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Lint, typecheck, test, licences
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm licences
      - name: npm audit signatures
        run: npm audit signatures
      - name: Repository checks
        run: node scripts/repo-checks.mjs

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint 1.7.12 (checksum-verified)
        run: |
          curl -fsSL -o actionlint.tgz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tgz" | sha256sum -c -
          tar xzf actionlint.tgz actionlint
      - run: ./actionlint -color

  required:
    name: CI required
    if: always()
    needs:
      - checks
      - actionlint
    runs-on: ubuntu-24.04
    steps:
      - name: Require all CI jobs to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          if jq -e '[.[] | .result] | any(. != "success" and . != "skipped")' <<< "$NEEDS_JSON"; then
            echo "A CI job failed or was cancelled" >&2
            exit 1
          fi
