name: Template

# create-mastra 1.34.2 takes only a whole repository as --template (MA-R0.5), so this job
# copies templates/loams-starter out of the workspace as a user would get it, installs it
# on its own, typechecks it and runs its test against Loams Postgres on loopback.
on:
  pull_request:
    paths:
      - "templates/**"
      - "test/conformance/loams/**"
      - ".github/workflows/template.yml"
  push:
    branches: [main]
    paths:
      - "templates/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  template:
    name: template_creates_and_passes
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Create the project from the template
        run: |
          cp -r templates/loams-starter "$RUNNER_TEMP/my-agent"
          cd "$RUNNER_TEMP/my-agent"
          printf 'minimumReleaseAge: 4320\nallowBuilds:\n  esbuild: false\n' > pnpm-workspace.yaml
          pnpm install
      - run: test/conformance/loams/install-loams.sh
      - run: test/conformance/loams/start-postgres.sh
      - name: Typecheck and test
        working-directory: ${{ runner.temp }}/my-agent
        run: |
          pnpm typecheck
          DATABASE_URL="$DB_URL" pnpm test:e2e
      - name: Stop
        if: always()
        run: test/conformance/loams/stop.sh ${{ job.status != 'success' && '--logs' || '' }}
