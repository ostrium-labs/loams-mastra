name: Conformance

# Mastra's own adapter suites, vendored at their release tags, against the pinned Loams
# release on the runner's loopback. GitHub-hosted runners only. No secrets: the auth cell
# mints a throwaway lk_ key.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  qdrant:
    name: Qdrant (auth ${{ matrix.auth }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        auth: [false, true]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: test/conformance/loams/install-loams.sh
      - name: Start loams dev
        run: test/conformance/loams/start-loams.sh ${{ matrix.auth && '--auth' || '' }}
      - name: Mastra's Qdrant suite
        working-directory: test/conformance
        env:
          SUITE: ${{ matrix.auth && 'qdrant-auth' || 'qdrant' }}
          LOAMS_NAMESPACE: ${{ matrix.auth && 'default' || '' }}
        run: |
          [ -n "$LOAMS_NAMESPACE" ] || unset LOAMS_NAMESPACE
          pnpm run "pinned:$SUITE"
      - name: no_secret_in_artifacts
        if: always()
        run: node scripts/repo-checks.mjs --artifacts test/conformance/results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: results-${{ matrix.auth && 'qdrant-auth' || 'qdrant' }}
          path: test/conformance/results/
          if-no-files-found: ignore
      - name: Stop
        if: always()
        run: test/conformance/loams/stop.sh ${{ job.status != 'success' && '--logs' || '' }}

  pg:
    name: pg (Loams Postgres)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: test/conformance/loams/install-loams.sh
      - run: test/conformance/loams/start-postgres.sh
      - name: Mastra's pg suite
        working-directory: test/conformance
        run: pnpm run pinned:pg
      - name: Loams Postgres checks (V1 to V6)
        if: always()
        working-directory: test/conformance
        run: pnpm run checks:postgres
      - name: no_secret_in_artifacts
        if: always()
        run: node scripts/repo-checks.mjs --artifacts test/conformance/results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: results-pg
          path: test/conformance/results/
          if-no-files-found: ignore
      - name: Stop
        if: always()
        run: test/conformance/loams/stop.sh ${{ job.status != 'success' && '--logs' || '' }}

  elasticsearch:
    name: Elasticsearch (observed)
    # Observed, not required (Q1009): it never blocks a merge.
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: test/conformance/loams/install-loams.sh
      - run: test/conformance/loams/start-loams.sh
      - name: Mastra's Elasticsearch suite
        working-directory: test/conformance
        run: ELASTICSEARCH_URL="$LOAMS_ES_URL" pnpm run pinned:es
      - name: no_secret_in_artifacts
        if: always()
        run: node scripts/repo-checks.mjs --artifacts test/conformance/results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: results-elasticsearch
          path: test/conformance/results/
          if-no-files-found: ignore
      - name: Stop
        if: always()
        run: test/conformance/loams/stop.sh ${{ job.status != 'success' && '--logs' || '' }}

  examples:
    name: Examples end to end
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: test/conformance/loams/install-loams.sh
      - run: test/conformance/loams/start-loams.sh --auth
      - run: test/conformance/loams/start-postgres.sh
      - name: quickstart_postgres_remembers_across_threads
        working-directory: examples/quickstart-postgres
        run: DATABASE_URL="$DB_URL" pnpm test:e2e
      - name: quickstart_qdrant_remembers_across_threads
        working-directory: examples/quickstart-qdrant
        env:
          LOAMS_NAMESPACE: default
        run: DATABASE_URL="$DB_URL" pnpm test:e2e
      - name: Stop
        if: always()
        run: test/conformance/loams/stop.sh ${{ job.status != 'success' && '--logs' || '' }}

  required:
    name: Conformance required
    if: always()
    needs:
      - qdrant
      - pg
      - examples
    runs-on: ubuntu-24.04
    steps:
      - name: Require every required conformance cell to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          if jq -e '[.[] | .result] | any(. != "success" and . != "skipped")' <<< "$NEEDS_JSON"; then
            echo "A conformance cell failed or was cancelled" >&2
            exit 1
          fi
