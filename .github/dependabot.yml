version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Bump exact versions to exact versions; never widen to a range.
    versioning-strategy: increase
    # Wait before proposing a new release (the 2026-06 @mastra/* npm compromise).
    cooldown:
      default-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      # Mastra packages move together: one PR, reviewed with the conformance results.
      mastra:
        patterns: ["@mastra/*", "mastra"]
      tooling:
        patterns: ["@biomejs/biome", "typescript", "vitest", "@types/node"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci
